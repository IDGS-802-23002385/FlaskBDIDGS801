{% extends "layout.html" %}
{% block container %}
{% import "_macros.html" as macros %}

<div class="max-w-2x2 mx-auto mt-16 bg-neutral-primary-soft p-10 rounded-base shadow-sm border border-default">

  <form action="/cursos/modificar?id={{id}}" method="POST" class="space-y-10">
    
    {{ form.csrf_token }}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="id" value="{{ id }}">
    <div class="grid md:grid-cols-2 gap-x-8 gap-y-12">

      {{ macros.camponuevo(form.nombre) }}
      {{ macros.camponuevo(form.descripcion) }}
      <select name="maestro_id" id="maestro_id" class="form-select">
        <option value="{{ maestro.id }}">{{ maestro.nombre }} {{ maestro.apellidos }}</option>
        {% for m in mae %}
            <option value="{{ m.id }}">
                {{ m.nombre }} {{ m.apellidos }}
            </option>
        {% endfor %}
       </select>

    </div>

    <!-- Botón -->
    <div class="flex justify-center pt-6">
      <form method="GET">
               <a href="/cursos"
                class="inline-block text-white bg-brand border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium font-medium rounded-base text-sm px-4 py-2 focus:outline-none">
                  Cancelar
              </a>
      </form>
      <button type="submit"
        class="text-white bg-brand hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium rounded-base text-sm px-8 py-3 transition">
        Modificar Curso
      </button>
    </div>

  </form>

</div>

{% endblock %}
