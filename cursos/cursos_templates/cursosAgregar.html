{% extends "layout.html" %}
{% block container %}
{% import "_macros.html" as macros %}

<div class="max-w-2x2 mx-auto mt-10 bg-neutral-primary-soft p-8 rounded-base shadow-sm border border-default">

  <form action="/curso/agregar" method="POST" class="space-y-6">
    
    {{ form.csrf_token }}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="grid md:grid-cols-2 gap-8">

      {{ macros.camponuevo(form.nombre) }}
      {{ macros.camponuevo(form.descripcion) }}
      <select name="maestro_id" id="maestro_id" class="form-select">
      <option value="">Selecciona un maestro</option>
      {% for m in mae %}
          <option value="{{ m.id }}">
              {{ m.nombre }} {{ m.apellidos }}
          </option>
      {% endfor %}
      </select>
    </div>

    <!-- Botón separado del grid -->
    <div class="pt-4">
      <form method="GET">
               <a href="/cursos"
                class="inline-block text-white bg-brand border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium font-medium rounded-base text-sm px-4 py-2 focus:outline-none">
                  Cancelar
              </a>
      </form>
      <button type="submit"
        class="w-full md:w-auto text-white bg-brand border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium rounded-base text-sm px-6 py-3 transition">
        Guardar Curso
      </button>
    </div>

  </form>

</div>

{% endblock %}
